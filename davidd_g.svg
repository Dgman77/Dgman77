<svg width="900" height="250">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="golden" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>

  <!-- Short form with wave animation -->
  <text x="50%" y="40%" dominant-baseline="middle" text-anchor="middle"
        font-size="120" fill="url(#golden)" font-weight="bold" letter-spacing="-10">
    <tspan dx="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0s" repeatCount="indefinite"/>
      D
    </tspan>
    <tspan dx="-20">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      _
    </tspan>
    <tspan dx="-20">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      G
    </tspan>
  </text>

  <!-- Full name below, fading in -->
  <text x="50%" y="75%" text-anchor="middle" dominant-baseline="middle"
        font-size="45" font-weight="700" fill="url(#golden)">
    <animate attributeName="opacity" values="0;0;1" dur="3s" begin="1s" fill="freeze"/>
    David Gideon J
  </text>
</svg>
