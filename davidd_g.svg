<svg width="1000" height="250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="linear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F3864"/>
      <stop offset="100%" stop-color="#4A90D9"/>
    </linearGradient>
    <linearGradient id="golden" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>

  <!-- Animated wave background -->
  <g transform="translate(500, 125) scale(1,1) translate(-500,-125)">
    <path d="M0 0L 0 120Q 250 160 500 130T 1000 155L 1000 0 Z" fill="url(#linear)" opacity="0.4">
      <animate attributeName="d" dur="20s" repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        values="M0 0L 0 120Q 250 160 500 130T 1000 155L 1000 0 Z;
                M0 0L 0 145Q 250 160 500 140T 1000 130L 1000 0 Z;
                M0 0L 0 165Q 250 135 500 165T 1000 130L 1000 0 Z;
                M0 0L 0 120Q 250 160 500 130T 1000 155L 1000 0 Z"/>
    </path>
  </g>

  <!-- Full name typing animation -->
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle"
        font-size="45" font-weight="700" fill="#ffffff">
    <tspan>
      <animate attributeName="textLength" from="0" to="220" dur="4s" fill="freeze"/>
      David Gideon J
    </tspan>
  </text>

  <!-- Short form D_G golden shimmer, same line -->
  <text x="75%" y="50%" dominant-baseline="middle" text-anchor="middle"
        font-size="60" fill="url(#golden)" font-weight="bold" letter-spacing="-10">
    <tspan dx="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0s" repeatCount="indefinite"/>
      D
    </tspan>
    <tspan dx="-10">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      _
    </tspan>
    <tspan dx="-10">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      G
    </tspan>
  </text>
</svg>
